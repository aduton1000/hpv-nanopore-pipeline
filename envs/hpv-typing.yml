# hpv-typing — optional k-mer / competitive-mapping read typing vs a custom 12-type HPV DB.
name: hpv-typing
channels:
  - conda-forge
  - bioconda
dependencies:
  - python >=3.10
  - minimap2 >=2.26
  - samtools >=1.19
  - pysam >=0.22
  - kraken2 >=2.1.3        # optional k-mer typing (custom 12-type HPV DB built separately)
  - seqkit >=2.6
